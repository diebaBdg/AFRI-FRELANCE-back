spring.application.name=afrifreelance-api

# ========================================================
# APPLICATION
# ========================================================
app.env=${APP_ENV:dev}

# ========================================================
# SERVER
# ========================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVLET_CONTEXT_PATH:/api/v1}

# ========================================================
# POSTGRESQL DATASOURCE
# ========================================================
spring.datasource.url=jdbc:postgresql://${SERVER_DS_URL:localhost}:${SERVER_DS_PORT:5432}/${DB_NAME:afrifreelance_db}
spring.datasource.username=${DB_USER_NAME:postgres}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================================
# HIKARI CONNECTION POOL
# ========================================================
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:600000}

# ========================================================
# JPA / HIBERNATE
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================================================
# FLYWAY
# ========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ========================================================
# JWT
# ========================================================
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLWxvbmctZW5vdWdo}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================================
# SECURITY
# ========================================================
app.security.enabled=${APP_SECURITY_ENABLED:true}

# ========================================================
# CORS
# ========================================================
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# ========================================================
# FILE UPLOAD
# ========================================================
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:15MB}
file.max-file-size=5242880
file.allowed-types=pdf,doc,docx,jpg,jpeg,png

# ========================================================
# OPENAPI / SWAGGER
# ========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
